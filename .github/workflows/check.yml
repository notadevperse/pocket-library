# Runs on every push and pull request: checks that ratings.json is well formed,
# the scripts follow their rules, the page script parses, and the bookmark code
# matches its readable source.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: python -m unittest discover tests -v
      - name: Shell script syntax
        run: bash -n pocket-library/scripts/fetch-sources.sh
